<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedina Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 15px;
            margin: 0;
        }
        .card-partita {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.02);
        }
        .titolo-partita {
            font-weight: bold;
            margin-bottom: 8px;
            text-align: center;
        }
        .bottoni-esito {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #0088cc;
            background: #fff;
            color: #0088cc;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn.selezionato {
            background: #0088cc;
            color: #fff;
        }
        #btn-invia {
            width: 100%;
            padding: 15px;
            background: #28a745;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        /* Stile del messaggio "Già giocato" */
        .messaggio-blocco {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h2>⚽ Schedina del Giorno</h2>
    
    <!-- Div per il messaggio di avviso -->
    <div id="avviso-gia-giocato" style="display: none;" class="messaggio-blocco">
        ⚠️ Hai già effettuato le scommesse per questa giornata!
    </div>

    <!-- Contenitore partite e bottone invia -->
    <div id="sezione-schedina">
        <div id="contenitore-partite"></div>
        <button id="btn-invia" onclick="inviaSchedinaCompleta()">Invia Schedina</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const urlParams = new URLSearchParams(window.location.search);
        const giaGiocato = urlParams.get('giocato') === '1';
        const partiteRaw = urlParams.get('partite');

        // Se l'utente ha già giocato, mostriamo l'avviso e nascondiamo la schedina
        if (giaGiocato) {
            document.getElementById('avviso-gia-giocato').style.display = 'block';
            document.getElementById('sezione-schedina').style.display = 'none';
        } else {
            // Altrimenti carichiamo la schedina normalmente
            let listaPartite = [];
            try {
                listaPartite = JSON.parse(decodeURIComponent(partiteRaw));
            } catch (e) {
                listaPartite = ["Partita 1", "Partita 2"];
            }

            let pronosticiScelti = {};

            const contenitore = document.getElementById('contenitore-partite');
            listaPartite.forEach((partita) => {
                const card = document.createElement('div');
                card.className = 'card-partita';
                card.innerHTML = `
                    <div class="titolo-partita">${partita}</div>
                    <div class="bottoni-esito">
                        <button class="btn" onclick="selezionaEsito('${partita}', '1', this)">1</button>
                        <button class="btn" onclick="selezionaEsito('${partita}', 'X', this)">X</button>
                        <button class="btn" onclick="selezionaEsito('${partita}', '2', this)">2</button>
                    </div>
                `;
                contenitore.appendChild(card);
            });

            function selezionaEsito(partita, esito, bottone) {
                pronosticiScelti[partita] = esito;
                const parent = bottone.parentElement;
                parent.querySelectorAll('.btn').forEach(b => b.classList.remove('selezionato'));
                bottone.classList.add('selezionato');
            }

            function inviaSchedinaCompleta() {
                if (Object.keys(pronosticiScelti).length < listaPartite.length) {
                    alert("Seleziona un esito per tutte le partite prima di inviare!");
                    return;
                }

                const payload = JSON.stringify({
                    tipo: "schedina_completa",
                    giocate: pronosticiScelti
                });

                tg.sendData(payload);
                tg.close();
            }
        }
    </script>
</body>
</html>
