<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedina Mini App Test</title>
    <!-- Carica la libreria ufficiale Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            text-align: center;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background-color: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
        }
        button:active {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <h2>⚽ Test Mini App</h2>
    <p>Ciao, <b id="user-name">Caricamento...</b>!</p>

    <div class="card">
        <h3>Anaune vs Nonsole</h3>
        <p>Scegli il pronostico:</p>
        <div class="btn-group">
            <button onclick="inviaPronostico('1')">1</button>
            <button onclick="inviaPronostico('X')">X</button>
            <button onclick="inviaPronostico('2')">2</button>
        </div>
    </div>

    <script>
        // Inizializza l'oggetto Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Mostra il nome dell'utente
        const user = tg.initDataUnsafe?.user;
        if (user && user.first_name) {
            document.getElementById('user-name').innerText = user.first_name;
        } else {
            document.getElementById('user-name').innerText = "Utente Telegram";
        }

        // Funzione chiamata al click dei pulsanti
       function inviaPronostico(scelta) {
            try {
                // 1. POP-UP DI TEST: Mostra una finestra di avviso sul telefono
                alert("Stai inviando il pronostico: " + scelta);

                // Vibrazione leggera sul telefono
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('medium');
                }

                // Dati da inviare al Python
                const payload = {
                    partita: "Anaune vs Nonsole",
                    pronostico: scelta
                };

                // Invia i dati al bot Telegram
                tg.sendData(JSON.stringify(payload));
                
                // Forza la chiusura della finestra
                tg.close();
            } catch (err) {
                alert("Errore invio: " + err.message);
            }
        }
            } catch (err) {
                alert("Errore invio: " + err.message);
            }
        }
    </script>
</body>
</html>
